version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: sgaa-backend
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - SESSION_PERSISTENCE_PATH=/app/backend/session
      - USE_MOCK=true
      - PYTHONUNBUFFERED=1
    volumes:
      - session_data:/app/backend/session
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sgaa-network

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: sgaa-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - sgaa-network

volumes:
  session_data:
    driver: local

networks:
  sgaa-network:
    driver: bridge
